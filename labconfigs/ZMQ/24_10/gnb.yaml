cu_cp:
  amf:
    addr: 10.10.3.200
    port: 38412
    bind_addr: 10.10.3.231
    sctp_nodelay: true

    sctp_rto_initial: 120
    sctp_rto_min: 120
    sctp_rto_max: 500
    no_core: false

    supported_tracking_areas:
      - tac: 1
        plmn_list:
          - plmn: "00101"
            tai_slice_support_list:
              - sst: 1
                sd: 000001
              - sst: 2
                sd: 000002
  inactivity_timer: 7200  

ru_sdr:
  device_driver: zmq
  device_args: tx_port=tcp://127.0.0.1:2000,rx_port=tcp://127.0.0.1:2001,base_srate=23.04e6
  srate: 23.04
  tx_gain: 75
  rx_gain: 75


cell_cfg:
  dl_arfcn: 368500
  band: 3
  channel_bandwidth_MHz: 20
  common_scs: 15
  plmn: "00101"
  tac: 1                            
  pdcch:
    common:
      ss0_index: 0                  
      coreset0_index: 12
    dedicated:
      ss2_type: common              
      dci_format_0_1_and_1_1: false 
  prach:
    prach_config_index: 1
  # pdsch:
  #   mcs_table: qam64
  # pusch:
  #   mcs_table: qam64


  slicing:                              
  -
    sst: 1                                  
    sd: 000001                         
    sched_cfg:                        
      min_prb_policy_ratio: 0        
      max_prb_policy_ratio: 50
  -
    sst: 2
    sd: 000002                   
    sched_cfg:
      min_prb_policy_ratio: 0
      max_prb_policy_ratio: 50


log:
  filename: /tmp/gnb.log
  all_level: info
  e2ap_level: debug

  # fapi_level: warning
  # metrics_level: none
  mac_level: debug
  # gtpu_level: warning
  # rlc_level: warning
  # phy_level: warning


e2:
  enable_cu_e2: true
  enable_du_e2: true
  addr: 129.97.168.82
  port: 36421
  bind_addr: 129.97.168.82 
  sctp_rto_initial: 120
  sctp_rto_min: 120
  sctp_rto_max: 500
  sctp_init_max_attempts: 3
  sctp_max_init_timeo: 500
  e2sm_kpm_enabled: true
  e2sm_rc_enabled: true

metrics:
  addr: 127.0.0.1
  port: 55555
  rlc_json_enable: 1
  rlc_report_period: 1000
