  #     min_prb_policy_ratio: 80
  #     max_prb_policy_ratio: 100


log: 
  filename: /tmp/du.log
  all_level: warning                    

pcap: 
  e2ap_filename: /tmp/gnb_e2ap.pcap    
  e2ap_enable: false                   

  f1ap_filename: /tmp/du_f1ap.pcap    
  f1ap_enable: true

  f1u_filename: /tmp/du_f1u.pcap      
  f1u_enable: true

  rlc_filename: /tmp/gnb_rlc.pcap      
  rlc_rb_type: all                     
  rlc_enable: false                    
  mac_filename: /tmp/gnb_mac.pcap      
  mac_type: udp                        
  mac_enable: false                    


metrics: 
  addr: 127.0.0.1
  port: 55555
  rlc_report_period: 1000
  rlc_json_enable: false
  enable_json_metrics: false
  autostart_stdout_metrics: false

