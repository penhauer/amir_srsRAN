f1ap:
  cu_cp_addr: 127.0.10.1
  # bind_addr: 127.0.13.2

# nru:
#   bind_addr: 127.0.13.2

ru_sdr:
  device_driver: uhd
  device_args: type=x300,product=X310,master_clock_rate=184.32e6,dboard_clck_rate=92.16e6,send_frame_size=8000,recv_frame_size=8000
  clock: internal
  sync: internal
  srate: 46.08
  freq_offset: 0
  clock_ppm: 0
  lo_offset: 0
  tx_gain: 31.5
  rx_gain: 20
  time_alignment_calibration: auto


cell_cfg:
  dl_arfcn: 627340
  band: 78
  channel_bandwidth_MHz: 40
  common_scs: 30
  plmn: "00101"
  tac: 1
  pci: 1
